
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#334155" stroke-width="6" />

  <!-- 3D Isometric Rubik's Cube Representation -->
  <g transform="translate(256, 250) scale(1.15)">
    <!-- Top Face (White/Cyan Tint) -->
    <!-- Center (0, -110) -->
    <!-- U0 (Back) -->
    <polygon points="0,-110 38,-88 0,-66 -38,-88" fill="#ffffff" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <!-- U1 (Back-Right) -->
    <polygon points="38,-88 76,-66 38,-44 0,-66" fill="#f1f5f9" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <!-- U2 (Right Corner) -->
    <polygon points="76,-66 114,-44 76,-22 38,-44" fill="#38bdf8" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <!-- U3 (Back-Left) -->
    <polygon points="-38,-88 0,-66 -38,-44 -76,-66" fill="#f8fafc" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <!-- U4 (Center) -->
    <polygon points="0,-66 38,-44 0,-22 -38,-44" fill="#ffffff" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <!-- U5 (Right-Front) -->
    <polygon points="38,-44 76,-22 38,0 0,-22" fill="#e2e8f0" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <!-- U6 (Left Corner) -->
    <polygon points="-76,-66 -38,-44 -76,-22 -114,-44" fill="#38bdf8" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <!-- U7 (Left-Front) -->
    <polygon points="-38,-44 0,-22 -38,0 -76,-22" fill="#f1f5f9" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <!-- U8 (Front Corner) -->
    <polygon points="0,-22 38,0 0,22 -38,0" fill="#ffffff" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />

    <!-- Left Face (Front-Left: Green & Orange accents) -->
    <polygon points="-114,-44 -76,-22 -76,22 -114,0" fill="#ea580c" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="-76,-22 -38,0 -38,44 -76,22" fill="#16a34a" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="-38,0 0,22 0,66 -38,44" fill="#22c55e" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />

    <polygon points="-114,0 -76,22 -76,66 -114,44" fill="#f97316" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="-76,22 -38,44 -38,88 -76,66" fill="#15803d" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="-38,44 0,66 0,110 -38,88" fill="#16a34a" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />

    <polygon points="-114,44 -76,66 -76,110 -114,88" fill="#c2410c" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="-76,66 -38,88 -38,132 -76,110" fill="#166534" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="-38,88 0,110 0,154 -38,132" fill="#15803d" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />

    <!-- Right Face (Front-Right: Red & Yellow accents) -->
    <polygon points="0,22 38,0 38,44 0,66" fill="#dc2626" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="38,0 76,-22 76,22 38,44" fill="#ef4444" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="76,-22 114,-44 114,0 76,22" fill="#eab308" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />

    <polygon points="0,66 38,44 38,88 0,110" fill="#b91c1c" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="38,44 76,22 76,66 38,88" fill="#dc2626" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="76,22 114,0 114,44 76,66" fill="#facc15" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />

    <polygon points="0,110 38,88 38,132 0,154" fill="#991b1b" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="38,88 76,66 76,110 38,132" fill="#b91c1c" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="76,66 114,44 114,88 76,110" fill="#ca8a04" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
  </g>
</svg>
